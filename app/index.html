<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0F; --card: #15161C; --line: #262833; --text: #FFFFFF;
    --muted: rgba(255,255,255,.55); --yellow: #FFD400;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 48px 32px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 22px; font-weight: 600; color: var(--muted); margin: 0; }
  .link { background: none; border: 0; color: var(--muted); font: 500 15px Inter; cursor: pointer; padding: 0 0 0 18px; }
  .link:hover { color: var(--text); }
  #q {
    width: 100%; font: 500 30px Inter, sans-serif; color: var(--text); background: var(--card);
    border: 2px solid var(--line); border-radius: 16px; padding: 22px 26px; outline: none; transition: border-color .2s;
  }
  #q:focus { border-color: #4a4d5c; }
  #q::placeholder { color: rgba(255,255,255,.3); }
  .controls { display: flex; gap: 22px; align-items: center; margin: 16px 2px 0; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
  .controls label { display: flex; gap: 8px; align-items: center; cursor: pointer; user-select: none; }
  .controls input { accent-color: #fff; width: 16px; height: 16px; }
  select { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: 500 15px Inter; }
  #stats { margin-left: auto; font-variant-numeric: tabular-nums; }
  #stats b { color: var(--text); font-weight: 600; }

  #job { display: none; margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; font-size: 15px; color: var(--muted); }
  #job .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  #job .fill { height: 100%; width: 0; background: #fff; transition: width .4s; }

  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
  #grid.lib { grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .card {
    position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; aspect-ratio: 4 / 3; opacity: 0; transform: translateY(10px);
    animation: in .45s cubic-bezier(.2,.7,.2,1) forwards; cursor: pointer;
  }
  .card.top { outline: 3px solid var(--yellow); outline-offset: 3px; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .card img.page { object-fit: cover; object-position: top; background: #fff; }
  .card img, .card video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
  .pill {
    position: absolute; background: rgba(11,11,15,.74); backdrop-filter: blur(6px); border-radius: 999px;
    padding: 6px 12px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .tag { left: 12px; top: 12px; display: flex; gap: 8px; }
  .tag .rank { color: var(--muted); }
  .score { right: 12px; bottom: 12px; }
  .when { left: 12px; bottom: 12px; }
  .lib .pill { display: none; }
  .lib .card { border-radius: 12px; }
  .audio { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 56px 20px 52px; }
  .audio canvas { width: 100%; height: 80px; }
  .audio .name { font-size: 19px; font-weight: 600; text-align: center; }
  .play { width: 46px; height: 46px; flex: none; aspect-ratio: 1; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .play svg { width: 18px; height: 18px; fill: var(--bg); }
  .playing-dot { right: 12px; top: 12px; display: none; }
  .card.on .playing-dot { display: block; }
  .lib .audio { padding: 12px; gap: 6px; }
  .lib .audio canvas { height: 36px; }
  .lib .audio .name { font-size: 12px; }
  .lib .play { display: none; }
  .empty { color: var(--muted); margin-top: 34px; font-size: 16px; }

  #rec .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ff4d4d; margin-right: 7px; vertical-align: 1px; }
  #rec.on .dot { animation: blink 1s steps(2, start) infinite; }
  #rec.on { color: #ff4d4d; }
  @keyframes blink { to { visibility: hidden; } }
  #drop {
    position: fixed; inset: 0; background: rgba(11,11,15,.88); display: none; place-items: center;
    font-size: 28px; font-weight: 600; border: 3px dashed rgba(255,255,255,.4); z-index: 10;
  }
  #lightbox {
    position: fixed; inset: 0; background: rgba(11,11,15,.92); display: grid; place-items: center;
    z-index: 12; opacity: 0; pointer-events: none; transition: opacity .25s ease; cursor: zoom-out;
  }
  #lightbox.open { opacity: 1; pointer-events: auto; }
  #lightbox figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; cursor: default; }
  #lightbox img {
    max-width: 92vw; max-height: 82vh; border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.6);
    transform: scale(.96); transition: transform .3s cubic-bezier(.2,.7,.2,1); background: #fff;
  }
  #lightbox.open img { transform: scale(1); }
  #lightbox figcaption { font-size: 17px; font-weight: 600; color: var(--text); display: flex; gap: 18px; align-items: center; }
  #lightbox a { color: var(--muted); font-weight: 500; }
  #credits {
    position: fixed; inset: 40px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 32px; overflow: auto; display: none; z-index: 11; font-size: 14px; line-height: 1.6;
  }
  #credits a { color: var(--text); }
  #credits .x { position: sticky; top: 0; float: right; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Search your photos, audio, videos and documents</h1>
    <div>
      <button class="link" id="rec"><span class="dot"></span><span class="label">Record note</span></button>
      <button class="link" id="add">Add files</button>
      <button class="link" id="showCredits">Credits</button>
    </div>
  </header>
  <input id="q" placeholder="Describe what you're looking for..." autocomplete="off" autofocus>
  <div class="controls">
    <label><input type="checkbox" id="each"> One of each</label>
    <label><input type="checkbox" id="autoplay" checked> Play top result</label>
    <label>Dimensions
      <select id="dim"><option>768</option><option>512</option><option>256</option><option>128</option></select>
    </label>
    <span id="stats"></span>
  </div>
  <div id="job"><span id="jobText"></span><div class="bar"><div class="fill"></div></div></div>
  <div id="grid"></div>
</main>
<div id="drop">Drop photos, audio, videos or PDFs to add them</div>
<div id="lightbox"><figure><img alt=""><figcaption><span></span><a target="_blank" hidden>Open the PDF at this page</a></figcaption></figure></div>
<div id="credits"><button class="link x" id="closeCredits">Close</button><div id="creditsBody"></div></div>
<input type="file" id="files" multiple hidden accept="image/*,audio/*,video/*,.pdf">

<script>
const $ = (s) => document.querySelector(s);
const grid = $("#grid"), stats = $("#stats");
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const mmss = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
let current = null;   // the card whose media is playing

function stopCurrent() {
  if (!current) return;
  current.media.pause();
  current.el.classList.remove("on");
  if (current.btn) current.btn.innerHTML = PLAY;
  current = null;
}

function toggle(entry) {
  if (current === entry) return stopCurrent();
  stopCurrent();
  current = entry;
  entry.el.classList.add("on");
  if (entry.btn) entry.btn.innerHTML = PAUSE;
  const go = () => {
    entry.media.currentTime = entry.start;
    entry.media.muted = false;
    entry.media.play().catch((e) => console.warn("play failed", e));
  };
  if (entry.media.readyState >= 1) return go();
  entry.media.addEventListener("loadedmetadata", go, { once: true });
  entry.media.preload = "auto";
  entry.media.load();   // audio uses preload="none", so nothing loads until we ask
}

async function drawWave(canvas, r, media) {
  const peaks = await (await fetch("/api/peaks?f=" + encodeURIComponent(r.file))).json();
  const ctx = canvas.getContext("2d");
  const W = canvas.width = canvas.clientWidth * devicePixelRatio, H = canvas.height = canvas.clientHeight * devicePixelRatio;
  const bw = W / peaks.length;
  const draw = () => {
    const dur = media.duration || 1, pos = media.currentTime / dur;
    const a = r.end ? r.start / dur : -1, b = r.end ? r.end / dur : -1;   // the matched window
    ctx.clearRect(0, 0, W, H);
    peaks.forEach((p, i) => {
      const x = i / peaks.length, h = Math.max(3, p * H * .92);
      const inMatch = x >= a && x <= b;
      ctx.fillStyle = (current && current.media === media && x < pos) ? "#FFFFFF" : inMatch ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.22)";
      ctx.beginPath(); ctx.roundRect(i * bw + bw * .2, (H - h) / 2, bw * .6, h, bw * .3); ctx.fill();
    });
  };
  media.addEventListener("loadedmetadata", draw);
  media.addEventListener("timeupdate", draw);
  draw();
}

function card(r, i, lib) {
  const el = document.createElement("div");
  el.className = "card" + (!lib && i === 0 ? " top" : "");
  el.style.animationDelay = (lib ? i * 20 : i * 80) + "ms";
  const label = { image: "Photo", audio: "Audio", video: "Video", doc: "Document" }[r.kind];
  const where = r.kind === "image" ? ""
    : r.kind === "doc" ? `<div class="pill when">${r.part === "text" ? "Read" : "Seen"} on page ${r.page}</div>`
    : `<div class="pill when">${r.part === "picture" ? "Seen" : "Heard"} at ${mmss(r.start)}</div>`;
  const pills = `<div class="pill tag"><span class="rank">${i + 1}</span>${label}</div>${where}<div class="pill score">${r.score.toFixed(2)}</div>`;
  let entry = null;
  if (r.kind === "image") {
    el.innerHTML = `<img src="${r.src}" alt="">${pills}`;
    el.querySelector("img").alt = r.name;
    el.onclick = () => openLightbox(r.src, r.name);
  } else if (r.kind === "doc") {
    // the matching page; clicking opens the document at that page
    el.innerHTML = `<img class="page" src="/api/page?f=${encodeURIComponent(r.file)}&p=${r.page || 1}" alt="">${pills}`;
    el.querySelector("img").alt = r.name;
    const isPdf = r.file.toLowerCase().endsWith(".pdf");
    el.onclick = () => isPdf
      ? openLightbox(`/api/page?f=${encodeURIComponent(r.file)}&p=${r.page || 1}&r=130`, `${r.name}, page ${r.page || 1}`, `${r.src}#page=${r.page || 1}`)
      : openLightbox(r.src, r.name);
  } else if (r.kind === "video") {
    const poster = `/api/thumb?f=${encodeURIComponent(r.file)}&t=${r.start + 0.5}`;
    el.innerHTML = `<video src="${r.src}#t=${r.start}" poster="${poster}" preload="metadata" muted playsinline></video>${pills}`;
    const media = el.querySelector("video");
    // show the frame where the match starts, not a black box
    media.addEventListener("loadedmetadata", () => { if (media.paused) media.currentTime = r.start + 0.1; }, { once: true });
    entry = { el, media, start: r.start };
    media.addEventListener("ended", stopCurrent);
  } else {
    el.innerHTML = `<div class="audio"><canvas></canvas><div class="play">${PLAY}</div><div class="name"></div></div>${pills}`;
    el.querySelector(".name").textContent = r.name;
    const media = new Audio();
    media.preload = "none";   // the waveform comes from /api/peaks; the sound loads when played
    media.src = r.src;
    entry = { el, media, start: r.start, btn: el.querySelector(".play") };
    media.addEventListener("ended", stopCurrent);
    requestAnimationFrame(() => drawWave(el.querySelector("canvas"), r, media));
  }
  if (entry) { el.onclick = () => toggle(entry); el.entry = entry; }
  return el;
}

function render(results, lib) {
  stopCurrent();
  grid.className = lib ? "lib" : "";
  grid.innerHTML = "";
  if (!results.length) { grid.innerHTML = '<div class="empty">Nothing here yet. Add files, or drop them on the page.</div>'; return []; }
  return results.map((r, i) => grid.appendChild(card(r, i, lib)));
}

async function showLibrary() {
  const { results } = await (await fetch("/api/library")).json();
  render(results, true);
  stats.innerHTML = `<b>${results.length}</b> files in the library`;
}

async function search() {
  const q = $("#q").value.trim();
  if (!q) return showLibrary();
  const params = new URLSearchParams({ q, k: 9, dim: $("#dim").value, each: $("#each").checked ? 1 : 0 });
  const res = await (await fetch("/api/search?" + params)).json();
  const els = render(res.results, false);
  stats.innerHTML = `<b>${res.ms} ms</b> &nbsp;·&nbsp; text-only model, ${res.params} &nbsp;·&nbsp; ${res.device} &nbsp;·&nbsp; ${res.dim} dims`;
  if ($("#autoplay").checked && els[0] && els[0].entry) setTimeout(() => toggle(els[0].entry), 400);
}

// Adding files: upload, then the full model indexes them in the background
async function upload(fileList) {
  for (const f of fileList) {
    await fetch("/api/upload", { method: "POST", headers: { "X-Filename": encodeURIComponent(f.name) }, body: f });
  }
  await fetch("/api/rescan", { method: "POST" });
  pollJob();
}

async function pollJob() {
  const j = await (await fetch("/api/status")).json();
  const box = $("#job");
  if (j.running) {
    box.style.display = "block";
    $("#jobText").textContent = j.total ? `Indexing with the full model: ${j.done} of ${j.total}  ${j.file}` : (j.message || "Starting the full model...");
    box.querySelector(".fill").style.width = (j.total ? (100 * j.done / j.total) : 4) + "%";
    setTimeout(pollJob, 800);
  } else if (box.style.display === "block") {
    $("#jobText").textContent = j.message.startsWith("FAILED") ? j.message : "Done. New files are searchable.";
    box.querySelector(".fill").style.width = "100%";
    setTimeout(() => (box.style.display = "none"), 2500);
    $("#q").value.trim() ? search() : showLibrary();
  }
}

let dragDepth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; $("#drop").style.display = "grid"; });
addEventListener("dragleave", () => { if (--dragDepth <= 0) $("#drop").style.display = "none"; });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; $("#drop").style.display = "none"; upload(e.dataTransfer.files); });
$("#add").onclick = () => $("#files").click();

// Record a voice note right here: it's saved as audio and indexed like any other file
let recorder = null, recTimer = null;
$("#rec").onclick = async () => {
  const btn = $("#rec"), label = btn.querySelector(".label");
  if (recorder) { recorder.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { label.textContent = "No microphone"; setTimeout(() => (label.textContent = "Record note"), 2500); return; }
  const chunks = [], t0 = Date.now();
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    clearInterval(recTimer); recorder = null;
    btn.classList.remove("on"); label.textContent = "Saving...";
    const res = await fetch("/api/record", { method: "POST", body: new Blob(chunks, { type: chunks[0]?.type }) });
    label.textContent = res.ok ? "Record note" : "Recording failed";
    if (res.ok) pollJob(); else setTimeout(() => (label.textContent = "Record note"), 2500);
  };
  recorder.start();
  btn.classList.add("on");
  const tick = () => { const s = Math.round((Date.now() - t0) / 1000); label.textContent = `Stop  ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  tick(); recTimer = setInterval(tick, 500);
};
$("#files").onchange = (e) => upload(e.target.files);

$("#showCredits").onclick = async () => {
  const c = await (await fetch("/api/credits")).json();
  const body = $("#creditsBody");
  body.innerHTML = "<h2>Credits</h2><p>Starter library from Wikimedia Commons. Public domain or Creative Commons, as listed.</p>";
  for (const [file, v] of Object.entries(c)) {
    const p = document.createElement("div");
    p.innerHTML = `<b></b>: <span></span>, <span></span>, <a target="_blank">source</a>`;
    p.querySelector("b").textContent = file;
    p.querySelectorAll("span")[0].textContent = v.author;
    p.querySelectorAll("span")[1].textContent = v.license;
    p.querySelector("a").href = v.source;
    body.appendChild(p);
  }
  $("#credits").style.display = "block";
};
$("#closeCredits").onclick = () => ($("#credits").style.display = "none");

function openLightbox(src, caption, pdfLink) {
  stopCurrent();
  const box = $("#lightbox");
  box.querySelector("img").src = src;
  box.querySelector("img").alt = caption;
  box.querySelector("figcaption span").textContent = caption;
  const a = box.querySelector("figcaption a");
  a.hidden = !pdfLink;
  if (pdfLink) a.href = pdfLink;
  box.classList.add("open");
}
const closeLightbox = () => $("#lightbox").classList.remove("open");
$("#lightbox").addEventListener("click", (e) => { if (!e.target.closest("img, a")) closeLightbox(); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#lightbox").classList.contains("open")) { e.stopImmediatePropagation(); closeLightbox(); } }, true);

$("#q").addEventListener("keydown", (e) => {
  if (e.key === "Enter") search();
  if (e.key === "Escape") { $("#q").value = ""; showLibrary(); }
});
["#each", "#dim"].forEach((s) => $(s).addEventListener("change", () => $("#q").value.trim() && search()));
showLibrary();
pollJob();
</script>
</body>
</html>
